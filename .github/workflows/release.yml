name: Release Texel VS Code Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Type check and unit tests
        run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install TeX (latexmk, synctex, latexdiff)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended latexdiff
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration

  build-and-publish:
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package -o texel-${{ github.ref_name }}.vsix

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: texel-${{ github.ref_name }}.vsix

      - name: Publish to VS Code Marketplace (if VSCE_PAT secret is set)
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (if OVSX_PAT secret is set)
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish texel-${{ github.ref_name }}.vsix -p ${{ secrets.OVSX_PAT }}
